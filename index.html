<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#f7f7f8"><title>Kei Phone</title><style>
*{box-sizing:border-box}body{margin:0;background:#ddd;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111}.phone{width:100vw;height:100vh;max-width:430px;margin:auto;background:#f7f7f8;position:relative;overflow:hidden}.status{height:44px;padding:14px 18px 0;display:flex;justify-content:space-between;font-size:13px;font-weight:600}.home{padding:24px 20px}.title{font-size:30px;font-weight:750;margin:10px 0 20px}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 12px}.app{text-align:center;font-size:12px}.icon{width:58px;height:58px;border-radius:15px;margin:auto auto 7px;display:grid;place-items:center;font-size:28px;box-shadow:0 2px 6px #0002}.dock{position:absolute;bottom:18px;left:14px;right:14px;background:#ffffffb8;backdrop-filter:blur(15px);border-radius:25px;padding:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.screen{position:absolute;inset:44px 0 0;background:#f7f7f8;transform:translateX(100%);transition:.25s;z-index:10}.screen.open{transform:translateX(0)}.nav{height:54px;padding:0 17px;display:flex;align-items:center;border-bottom:1px solid #ddd;font-size:18px;font-weight:700}.back{font-size:28px;margin-right:12px;font-weight:400}.list,.panel{padding:10px 14px}.row{background:white;border-radius:14px;padding:13px;margin:8px 0;display:flex;align-items:center;gap:12px}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#333;color:white;font-size:23px}.sub,.small{color:#777;font-size:13px;margin-top:3px}.chat{display:flex;flex-direction:column;height:calc(100% - 54px)}.msgs{flex:1;overflow:auto;padding:12px}.bubble{max-width:78%;padding:10px 13px;border-radius:18px;margin:7px 0;line-height:1.35;font-size:16px;white-space:pre-wrap}.me{margin-left:auto;background:#1683ff;color:white;border-bottom-right-radius:5px}.them{background:#e5e5ea;border-bottom-left-radius:5px}.composer{padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;background:white;border-top:1px solid #ddd}.composer input{flex:1;border:1px solid #ccc;border-radius:20px;padding:9px 13px;font-size:16px}.send,.primary{border:0;border-radius:20px;background:#1683ff;color:white;padding:0 16px;font-weight:600}.field{margin:12px 0}.field label{display:block;color:#666;font-size:13px;margin-bottom:5px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font-size:15px}.field textarea{min-height:90px}.primary{width:100%;padding:12px;border-radius:11px;font-size:15px}
</style></head><body><div class="phone"><div class="status"><span id="time"></span><span>▮▮▮ Wi‑Fi 🔋</span></div><main class="home"><div class="title">Kei Phone</div><div class="apps"><div class="app" onclick="openS('messages')"><div class="icon">💬</div>Messages</div><div class="app" onclick="openS('contacts')"><div class="icon">👤</div>Contacts</div><div class="app" onclick="openS('notes')"><div class="icon">📝</div>Notes</div><div class="app" onclick="openS('settings')"><div class="icon">⚙️</div>Settings</div></div></main><div class="dock"><div class="app" onclick="openS('messages')">💬</div><div class="app" onclick="openS('contacts')">👤</div><div class="app" onclick="openS('notes')">📝</div><div class="app" onclick="openS('settings')">⚙️</div></div>
<section id="messages" class="screen"><div class="nav"><span class="back" onclick="closeS('messages')">‹</span>Messages</div><div class="list"><div class="row" onclick="openS('chat')"><div class="avatar">👻</div><div><b>Ghost</b><div class="sub" id="preview">No messages yet</div></div></div></div></section>
<section id="contacts" class="screen"><div class="nav"><span class="back" onclick="closeS('contacts')">‹</span>Contacts</div><div class="list"><div class="row" onclick="openS('chat')"><div class="avatar">👻</div><div><b>Ghost</b><div class="sub">Online</div></div></div></div></section>
<section id="notes" class="screen"><div class="nav"><span class="back" onclick="closeS('notes')">‹</span>Notes</div><div class="panel"><div class="field"><label>Quick note</label><textarea id="note"></textarea></div><button class="primary" onclick="localStorage.setItem('note',note.value);alert('Saved')">Save</button></div></section>
<section id="settings" class="screen"><div class="nav"><span class="back" onclick="closeS('settings')">‹</span>Settings</div><div class="panel"><div class="field"><label>API Base URL</label><input id="base" value="https://api.siliconflow.cn/v1"></div><div class="field"><label>API Key</label><input id="key" type="password" placeholder="sk-..."></div><div class="field"><label>Model</label><input id="model" value="Qwen/Qwen3-8B"></div><div class="field"><label>Ghost personality</label><textarea id="persona">You are Ghost. Calm, dry, protective and direct. Speak naturally and conversationally. Never mention that you are an AI.</textarea></div><button class="primary" onclick="save()">Save settings</button><p class="small">Settings and chat history stay in this browser.</p></div></section>
<section id="chat" class="screen"><div class="nav"><span class="back" onclick="closeS('chat')">‹</span>Ghost</div><div class="chat"><div class="msgs" id="msgs"></div><div class="composer"><input id="input" placeholder="Message" onkeydown="if(event.key==='Enter')send()"><button class="send" onclick="send()">Send</button></div></div></section></div>
<script>
const $=x=>document.getElementById(x);let ms=JSON.parse(localStorage.ms||'[]');function openS(x){$(x).classList.add('open');if(x==='chat')render();if(x==='notes')note.value=localStorage.note||''}function closeS(x){$(x).classList.remove('open')}function save(){localStorage.base=base.value.trim();localStorage.key=key.value.trim();localStorage.model=model.value.trim();localStorage.persona=persona.value.trim();alert('Saved')}function load(){base.value=localStorage.base||base.value;key.value=localStorage.key||'';model.value=localStorage.model||model.value;persona.value=localStorage.persona||persona.value}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){msgs.innerHTML=ms.map(m=>'<div class="bubble '+(m.role==='user'?'me':'them')+'">'+esc(m.text)+'</div>').join('');msgs.scrollTop=msgs.scrollHeight;preview.textContent=ms.at(-1)?.text||'No messages yet'}async function send(){let t=input.value.trim();if(!t)return;input.value='';ms.push({role:'user',text:t});localStorage.ms=JSON.stringify(ms);render();if(!localStorage.key){ms.push({role:'assistant',text:'Set your API Key in Settings first.'});localStorage.ms=JSON.stringify(ms);render();return}let placeholder={role:'assistant',text:'…'};ms.push(placeholder);render();try{let r=await fetch((localStorage.base||base.value).replace(/\/$/,'')+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.key},body:JSON.stringify({model:localStorage.model||model.value,messages:[{role:'system',content:localStorage.persona||persona.value},...ms.slice(0,-1).map(x=>({role:x.role,content:x.text}))],temperature:.8})});let d=await r.json();if(!r.ok)throw Error(d.error?.message||d.message||('HTTP '+r.status));placeholder.text=d.choices[0].message.content}catch(e){placeholder.text='Error: '+e.message}localStorage.ms=JSON.stringify(ms);render()}load();$('time').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
</script></body></html>
